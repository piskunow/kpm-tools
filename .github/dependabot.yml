version: 2
# Daily individual PRs produced an unreviewable backlog (14 open PRs by the time
# this was cleaned up). Weekly grouped updates keep the noise manageable.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/.github/workflows"
    schedule:
      interval: weekly
    groups:
      ci-tooling:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: weekly
    groups:
      docs:
        patterns:
          - "*"
    ignore:
      # Sphinx 9.2+ requires Python >=3.13, but Read the Docs builds these
      # requirements on 3.12 (see .readthedocs.yml). Dependabot cannot see
      # that constraint, so it proposes versions the docs install rejects.
      # REMOVE THIS when .readthedocs.yml moves to Python 3.13.
      - dependency-name: "sphinx"
        versions: [">=9.2"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: "all"
    groups:
      python-packages:
        patterns:
          - "*"
    ignore:
      # kwant 1.5.0 ships pre-generated Cython C sources that access
      # PyArray_Descr.subarray, a struct member made opaque in NumPy 2, so it
      # cannot compile against NumPy 2.x. scipy >= 1.14 requires NumPy 2.
      # Remove both entries once kwant publishes a NumPy 2 compatible release.
      - dependency-name: "numpy"
        versions: [">=2.0"]
      - dependency-name: "scipy"
        versions: [">=1.14"]
